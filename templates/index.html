<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oralis AI - Tutor en Tiempo Real</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f4f6f9; color: #333; }
        
        /* SIDEBAR */
        .sidebar { width: 320px; background-color: #ffffff; border-right: 1px solid #e1e8ed; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .sidebar h2 { color: #1e40af; font-size: 1.5rem; margin-bottom: 5px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: #475569; }
        .form-group select, .form-group input { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
        
        .feedback-section { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-top: auto; }
        .feedback-section h3 { font-size: 0.9rem; color: #1e293b; margin-bottom: 8px; }
        .feedback-form { display: flex; flex-direction: column; gap: 8px; }
        .feedback-form select, .feedback-form input { padding: 6px; font-size: 0.85rem; border: 1px solid #cbd5e1; border-radius: 4px; }
        .feedback-form button { background-color: #10b981; color: white; border: none; padding: 6px; border-radius: 4px; font-weight: 600; cursor: pointer; }
        
        .user-info { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #e2e8f0; font-size: 0.85rem; }
        .btn-logout { color: #ef4444; text-decoration: none; font-weight: 600; }

        /* MAIN CHAT AREA */
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; }
        .chat-header { background-color: #ffffff; padding: 15px 20px; border-bottom: 1px solid #e1e8ed; font-weight: 600; color: #1e293b; }
        
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-color: #f8fafc; }
        .mensaje { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
        .mensaje-usuario { align-self: flex-end; background-color: #2563eb; color: white; border-bottom-right-radius: 2px; }
        .mensaje-oralis { align-self: flex-start; background-color: #ffffff; color: #1e293b; border: 1px solid #e2e8f0; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        
        .btn-audio { margin-top: 8px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 4px; padding: 4px 8px; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .btn-audio:hover { background: #e2e8f0; }

        /* INPUT AREA */
        .chat-input-area { background-color: #ffffff; padding: 15px 20px; border-top: 1px solid #e1e8ed; display: flex; flex-direction: column; gap: 5px; }
        .chat-form { display: flex; align-items: center; gap: 10px; }
        
        .btn-icon { background: none; border: 1px solid #cbd5e1; font-size: 1.2rem; cursor: pointer; padding: 8px 12px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { background-color: #f1f5f9; }
        
        #input-mensaje { flex: 1; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; outline: none; }
        #input-mensaje:focus { border-color: #2563eb; }
        
        .btn-send { background-color: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-send:hover { background-color: #1d4ed8; }
        
        .file-indicator { font-size: 0.8rem; color: #64748b; margin-left: 50px; }
    </style>
</head>
<body>

    <!-- SIDEBAR: OPCIONES DE APRENDIZAJE -->
    <div class="sidebar">
        <h2>Oralis AI</h2>

        <div class="form-group">
            <label for="idioma">Idioma Objetivo:</label>
            <select id="idioma" name="idioma" onchange="actualizarExamenes()">
                <option value="en" selected>Inglés</option>
                <option value="fr">Francés</option>
                <option value="de">Alemán</option>
                <option value="it">Italiano</option>
                <option value="pt">Portugués</option>
                <option value="es">Español</option>
                <option value="zh">Chino Mandarín</option>
                <option value="ja">Japonés</option>
                <option value="ru">Ruso</option>
                <option value="ro">Rumano</option>
                <option value="nl">Holandés</option>
                <option value="ar">Árabe</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nivel">Nivel Marco Europeo (CEFR):</label>
            <select id="nivel" name="nivel">
                <option value="A1">A1 (Principiante)</option>
                <option value="A2">A2 (Básico)</option>
                <option value="B1" selected>B1 (Intermedio)</option>
                <option value="B2">B2 (Intermedio Alto)</option>
                <option value="C1">C1 (Avanzado)</option>
                <option value="C2">C2 (Maestría)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="modo">Modo de Aprendizaje:</label>
            <select id="modo" name="modo" onchange="toggleModos()">
                <option value="tutor_original">Tutor General</option>
                <option value="practicas_orales">Simulación de Rol / Práctica Oral</option>
                <option value="examen">Preparación Examen Oficial</option>
                <option value="writing">Evaluador de Textos / Writing</option>
            </select>
        </div>

        <!-- Opción Dinámica: Método de Writing -->
        <div class="form-group" id="group-writing" style="display: none;">
            <label for="metodo_writing">Método de Corrección:</label>
            <select id="metodo_writing" name="metodo_writing">
                <option value="gramatica" selected>1. Corrección Gramatical y Estilística Directa</option>
                <option value="socratico">2. Método Guiado / Socrático (Pistas y Auto-corrección)</option>
            </select>
        </div>

        <!-- Opción Dinámica: Rol / Profesión -->
        <div class="form-group" id="group-profesion" style="display: none;">
            <label for="profesion">Perfil de Simulación:</label>
            <select id="profesion" name="profesion" onchange="toggleCustomProfesion()">
                <option value="Entrevista de Trabajo">Entrevista de Trabajo</option>
                <option value="Atención al Cliente">Atención al Cliente / Turista</option>
                <option value="Médico / Salud">Consulta Médica</option>
                <option value="Negocios / Reunión">Reunión de Negocios</option>
                <option value="Otro">Otro (Personalizado)</option>
            </select>
            <input type="text" id="profesion_custom" name="profesion_custom" placeholder="Especifica el rol..." style="display: none; margin-top: 5px;">
        </div>

        <!-- Opción Dinámica: Exámenes -->
        <div class="form-group" id="group-examen" style="display: none;">
            <label for="tipo_examen">Examen Oficial:</label>
            <select id="tipo_examen" name="tipo_examen">
                <!-- Se llena dinámicamente -->
            </select>
        </div>

        <!-- Opción Dinámica: Tema -->
        <div class="form-group">
            <label for="tema">Tema o Contexto Libre:</label>
            <input type="text" id="tema" name="tema" placeholder="E.g., Vocabulario de viajes...">
        </div>

        <!-- FEEDBACK EN LA BARRA LATERAL -->
        <div class="feedback-section">
            <h3>¿Qué te parece Oralis?</h3>
            <form id="form-feedback" class="feedback-form" onsubmit="enviarFeedback(event)">
                <select name="puntuacion" required>
                    <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                    <option value="4">⭐⭐⭐⭐ (4/5)</option>
                    <option value="3">⭐⭐⭐ (3/5)</option>
                    <option value="2">⭐⭐ (2/5)</option>
                    <option value="1">⭐ (1/5)</option>
                </select>
                <input type="text" name="comentario" placeholder="Escribe tu opinión..." required>
                <button type="submit">Enviar Opinión</button>
            </form>
            <p id="msg-feedback" style="font-size: 0.75rem; color: #10b981; margin-top: 5px;"></p>
        </div>

        <!-- DATOS DEL USUARIO -->
        <div class="user-info">
            <span>👤 {{ usuario.email }}</span>
            <a href="/logout" class="btn-logout">Salir</a>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL: CHAT -->
    <div class="main-content">
        <div class="chat-header">
            Oralis AI - Tutor en Tiempo Real
        </div>

        <div id="chat-box" class="chat-box">
            <div class="mensaje mensaje-oralis">
                <div class="contenido-texto">¡Hola! Soy Oralis. Selecciona tu idioma y nivel en el menú de la izquierda y escríbeme para comenzar a practicar.</div>
            </div>
        </div>

        <div class="chat-input-area">
            <form id="form-chat" class="chat-form" onsubmit="enviarMensaje(event)">
                <!-- Adjuntar Archivo (SOLO EN WRITING) -->
                <button type="button" id="btn-attach" class="btn-icon" title="Adjuntar PDF, DOCX o TXT" style="display: none;" onclick="document.getElementById('archivo').click();">
                    📎
                </button>
                <input type="file" id="archivo" name="archivo" accept=".pdf,.docx,.txt" style="display: none;" onchange="mostrarNombreArchivo()">

                <!-- Micrófono (EN TODOS LOS DEMÁS MODOS) -->
                <button type="button" id="btn-mic" class="btn-icon" title="Hablar por micrófono" onclick="toggleMicrofono()">
                    🎤
                </button>

                <!-- Campo de texto -->
                <input type="text" id="input-mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." autocomplete="off">

                <!-- Botón de Envío -->
                <button type="submit" class="btn-send">Enviar</button>
            </form>
            <div id="file-indicator" class="file-indicator"></div>
        </div>
    </div>

    <!-- JAVASCRIPT DE LA APLICACIÓN -->
    <script>
        let rec;
        let escuchando = false;

        // Configuración de Reconocimiento de Voz
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            rec = new SpeechRecognition();
            rec.continuous = false;
            rec.interimResults = false;

            rec.onresult = function(event) {
                document.getElementById('input-mensaje').value = event.results[0][0].transcript;
                detenerMicrofono();
            };

            rec.onerror = function() { detenerMicrofono(); };
            rec.onend = function() { detenerMicrofono(); };
        }

        function toggleMicrofono() {
            if (!rec) {
                alert("Tu navegador no soporta entrada de voz por micrófono.");
                return;
            }
            const btnMic = document.getElementById('btn-mic');
            if (!escuchando) {
                const idioma = document.getElementById('idioma').value;
                if (idioma === 'en') rec.lang = 'en-US';
                else if (idioma === 'fr') rec.lang = 'fr-FR';
                else if (idioma === 'de') rec.lang = 'de-DE';
                else if (idioma === 'it') rec.lang = 'it-IT';
                else if (idioma === 'pt') rec.lang = 'pt-PT';
                else rec.lang = 'es-ES';

                rec.start();
                escuchando = true;
                btnMic.style.backgroundColor = '#fee2e2';
                btnMic.innerText = '🔴';
            } else {
                detenerMicrofono();
            }
        }

        function detenerMicrofono() {
            if (rec && escuchando) rec.stop();
            escuchando = false;
            const btnMic = document.getElementById('btn-mic');
            if (btnMic) {
                btnMic.style.backgroundColor = 'transparent';
                btnMic.innerText = '🎤';
            }
        }

        // Reproducción de voz para las respuestas de Oralis
        function reproducirTexto(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                const idioma = document.getElementById('idioma').value;

                if (idioma === 'en') utterance.lang = 'en-US';
                else if (idioma === 'fr') utterance.lang = 'fr-FR';
                else if (idioma === 'de') utterance.lang = 'de-DE';
                else if (idioma === 'it') utterance.lang = 'it-IT';
                else if (idioma === 'pt') utterance.lang = 'pt-PT';
                else utterance.lang = 'es-ES';

                window.speechSynthesis.speak(utterance);
            }
        }

        // Alternar visualización entre Clip y Micrófono según el Modo
        function toggleModos() {
            const modo = document.getElementById('modo').value;

            document.getElementById('group-profesion').style.display = (modo === 'practicas_orales') ? 'flex' : 'none';
            document.getElementById('group-examen').style.display = (modo === 'examen') ? 'flex' : 'none';
            document.getElementById('group-writing').style.display = (modo === 'writing') ? 'flex' : 'none';

            const btnAttach = document.getElementById('btn-attach');
            const btnMic = document.getElementById('btn-mic');

            if (modo === 'writing') {
                btnAttach.style.display = 'inline-flex';
                btnMic.style.display = 'none';
            } else {
                btnAttach.style.display = 'none';
                btnMic.style.display = 'inline-flex';
            }
        }

        function toggleCustomProfesion() {
            const val = document.getElementById('profesion').value;
            document.getElementById('profesion_custom').style.display = (val === 'Otro') ? 'block' : 'none';
        }

        async function actualizarExamenes() {
            const idioma = document.getElementById('idioma').value;
            const selectExamen = document.getElementById('tipo_examen');
            selectExamen.innerHTML = '';
            
            try {
                const res = await fetch('/api/examenes/' + idioma);
                const data = await res.json();
                data.examenes.forEach(ex => {
                    const opt = document.createElement('option');
                    opt.value = ex;
                    opt.textContent = ex;
                    selectExamen.appendChild(opt);
                });
            } catch (e) {
                console.error("Error al obtener exámenes:", e);
            }
        }

        function mostrarNombreArchivo() {
            const input = document.getElementById('archivo');
            const indicator = document.getElementById('file-indicator');
            if (input.files && input.files[0]) {
                indicator.innerText = '📄 Archivo cargado: ' + input.files[0].name;
            } else {
                indicator.innerText = '';
            }
        }

        function agregarMensaje(emisor, texto) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'mensaje ' + (emisor === 'user' ? 'mensaje-usuario' : 'mensaje-oralis');

            if (emisor === 'oralis') {
                const idTexto = 'msg-' + Date.now();
                msgDiv.innerHTML = `
                    <div class="contenido-texto" id="${idTexto}"></div>
                    <button type="button" class="btn-audio" onclick="reproducirTexto(document.getElementById('${idTexto}').innerText)">🔊 Escuchar</button>
                `;
                chatBox.appendChild(msgDiv);
                return document.getElementById(idTexto);
            } else {
                msgDiv.innerText = texto;
                chatBox.appendChild(msgDiv);
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function enviarMensaje(e) {
            e.preventDefault();
            const input = document.getElementById('input-mensaje');
            const mensaje = input.value.trim();
            const archivoInput = document.getElementById('archivo');

            if (!mensaje && (!archivoInput.files || archivoInput.files.length === 0)) return;

            // Renderizar mensaje del usuario en pantalla
            let textoUsuario = mensaje;
            if (archivoInput.files && archivoInput.files[0]) {
                textoUsuario += ` (📄 Archivo: ${archivoInput.files[0].name})`;
            }
            agregarMensaje('user', textoUsuario);

            // Preparar envío
            const formData = new FormData(document.getElementById('form-chat'));
            formData.append('idioma', document.getElementById('idioma').value);
            formData.append('nivel', document.getElementById('nivel').value);
            formData.append('modo', document.getElementById('modo').value);
            formData.append('metodo_writing', document.getElementById('metodo_writing').value);
            formData.append('profesion', document.getElementById('profesion').value);
            formData.append('profesion_custom', document.getElementById('profesion_custom').value);
            formData.append('tipo_examen', document.getElementById('tipo_examen').value);
            formData.append('tema', document.getElementById('tema').value);

            // Limpiar formulario
            input.value = '';
            archivoInput.value = '';
            document.getElementById('file-indicator').innerText = '';

            // Contenedor de la respuesta de Oralis
            const elemOralis = agregarMensaje('oralis', '');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    body: formData
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.substring(6));
                            if (data.content) {
                                elemOralis.innerText += data.content;
                                const chatBox = document.getElementById('chat-box');
                                chatBox.scrollTop = chatBox.scrollHeight;
                            }
                        }
                    }
                }
            } catch (err) {
                console.error("Error al enviar el mensaje:", err);
                elemOralis.innerText = "Lo siento, ha ocurrido un error de conexión.";
            }
        }

        async function enviarFeedback(e) {
            e.preventDefault();
            const form = document.getElementById('form-feedback');
            const formData = new FormData(form);

            try {
                const res = await fetch('/api/feedback', { method: 'POST', body: formData });
                const data = await res.json();
                document.getElementById('msg-feedback').innerText = data.mensaje;
                form.reset();
            } catch (err) {
                console.error("Error al enviar feedback:", err);
            }
        }

        // Inicialización al cargar la página
        window.onload = function() {
            actualizarExamenes();
            toggleModos();
        };
    </script>
</body>
</html>
