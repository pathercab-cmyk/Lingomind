<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oralis - Tutor & Profesor de Idiomas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .chat-box { height: 380px; overflow-y: auto; background-color: #0f172a; border-radius: 8px; padding: 15px; }
        .nav-tabs .nav-link { color: #94a3b8; }
        .nav-tabs .nav-link.active { background-color: #1e293b; color: #38bdf8; border-color: #334155 #334155 #1e293b; font-weight: bold; }
        .msg-user { text-align: right; color: #38bdf8; margin-bottom: 10px; }
        .msg-oralis { text-align: left; color: #f1f5f9; margin-bottom: 15px; background-color: #334155; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body class="container py-4">

    <div class="text-center mb-4">
        <h1 class="fw-bold text-info">Oralis</h1>
        <p class="text-secondary">Plataforma Inteligente para el Aprendizaje de Idiomas</p>
    </div>

    <!-- Navegación por Pestañas -->
    <ul class="nav nav-tabs mb-4" id="oralisTabs">
        <li class="nav-item">
            <button class="nav-link active" onclick="cambiarModo('profesor')">🎓 Modo Profesor</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" onclick="cambiarModo('tutor')">💼 Tutor / Profesiones</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" onclick="cambiarModo('practica')">💬 Práctica Conversacional</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" onclick="cambiarModo('writing')">📝 Corrección de Writing</button>
        </li>
    </ul>

    <!-- Configuración Global -->
    <div class="card card-custom p-3 mb-4">
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Idioma Objetivo:</label>
                <select id="selIdioma" class="form-select bg-dark text-light border-secondary">
                    <option value="en">Inglés</option>
                    <option value="fr">Francés</option>
                    <option value="de">Alemán</option>
                    <option value="it">Italiano</option>
                    <option value="pt">Portugués</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Nivel MCERL:</label>
                <select id="selNivel" class="form-select bg-dark text-light border-secondary">
                    <option value="A1">A1 - Principiante</option>
                    <option value="A2">A2 - Elemental</option>
                    <option value="B1" selected>B1 - Intermedio</option>
                    <option value="B2">B2 - Intermedio Alto</option>
                    <option value="C1">C1 - Avanzado</option>
                </select>
            </div>
            
            <!-- Opción dinámica para Profesiones -->
            <div class="col-md-3 d-none" id="divProfesion">
                <label class="form-label">Profesión / Rol:</label>
                <input type="text" id="inputProfesion" class="form-control bg-dark text-light border-secondary" placeholder="Ej. Camarero, Médico, Entrevistador">
            </div>

            <!-- Tema / Lección -->
            <div class="col-md-3" id="divTema">
                <label class="form-label">Tema o Situación:</label>
                <input type="text" id="inputTema" class="form-control bg-dark text-light border-secondary" value="Presentaciones y conversación general">
            </div>
        </div>
    </div>

    <!-- SECCIÓN CHAT (Profesor / Tutor / Práctica) -->
    <div id="seccionChat" class="card card-custom p-4">
        <div id="chatBox" class="chat-box mb-3"></div>
        <div class="input-group mb-3">
            <input type="text" id="userMsg" class="form-control bg-dark text-light border-secondary" placeholder="Escribe tu mensaje o respuesta aquí...">
            <button class="btn btn-primary" onclick="enviarMensaje()">Enviar</button>
        </div>
        <div class="d-flex justify-content-between">
            <button id="btnEvaluar" class="btn btn-warning d-none" onclick="finalizarYEvaluar()">📊 Finalizar y Ver Informe de Práctica</button>
        </div>
    </div>

    <!-- SECCIÓN WRITING -->
    <div id="seccionWriting" class="card card-custom p-4 d-none">
        <h4 class="text-info mb-3">Corrección y Análisis de Redacción</h4>
        <div class="mb-3">
            <label class="form-label">Escribe o pega tu texto aquí:</label>
            <textarea id="writingTexto" class="form-control bg-dark text-light border-secondary" rows="5"></textarea>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label">O sube un archivo (PDF, Word, TXT):</label>
                <input type="file" id="writingFile" class="form-control bg-dark text-light border-secondary">
            </div>
            <div class="col-md-6">
                <label class="form-label">Modo de Corrección:</label>
                <select id="writingModo" class="form-select bg-dark text-light border-secondary">
                    <option value="explicativa">Detallada palabra por palabra</option>
                    <option value="senalar">Señalar tipo de error</option>
                    <option value="descubrimiento">Modo Autodescubrimiento (con pistas)</option>
                </select>
            </div>
        </div>
        <button class="btn btn-success" onclick="procesarWriting()">Enviar para Corrección</button>

        <div id="writingResultado" class="mt-4 p-3 bg-dark rounded border border-secondary d-none"></div>
    </div>

    <!-- MODAL DE INFORME FINAL -->
    <div id="informeBox" class="card card-custom p-4 mt-4 d-none">
        <h3 class="text-warning">Resultados del Informe de Práctica</h3>
        <hr class="border-secondary">
        <div id="informeContenido"></div>
    </div>

    <script>
        let modoActual = 'profesor';
        let historialConversacion = [];

        function cambiarModo(modo) {
            modoActual = modo;
            document.getElementById('divProfesion').classList.toggle('d-none', modo !== 'tutor');
            document.getElementById('seccionChat').classList.toggle('d-none', modo === 'writing');
            document.getElementById('seccionWriting').classList.toggle('d-none', modo !== 'writing');
            document.getElementById('btnEvaluar').classList.toggle('d-none', modo !== 'practica');
        }

        async function enviarMensaje() {
            const input = document.getElementById('userMsg');
            const mensaje = input.value.trim();
            if (!mensaje) return;

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="msg-user"><strong>Tú:</strong> ${mensaje}</div>`;
            historialConversacion.push({ usuario: mensaje });
            input.value = "";

            const payload = {
                mensaje: mensaje,
                idioma: document.getElementById('selIdioma').value,
                nivel: document.getElementById('selNivel').value,
                modo: modoActual,
                profesion: document.getElementById('inputProfesion').value || "Profesor de Idiomas",
                tema: document.getElementById('inputTema').value
            };

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                let respuestaHTML = `<div class="msg-oralis"><strong>Oralis:</strong> ${data.respuesta || ''}<br>`;
                
                if (data.explicacion) respuestaHTML += `<small class="text-info">📌 ${data.explicacion}</small><br>`;
                if (data.ejercicio) respuestaHTML += `<small class="text-warning">✏️ Ejercicio: ${data.ejercicio}</small><br>`;
                if (data.consejo_situacional) respuestaHTML += `<small class="text-info">💡 ${data.consejo_situacional}</small><br>`;
                
                respuestaHTML += `<button class="btn btn-sm btn-outline-light mt-2" onclick="reproducirAudio('${data.respuesta}')">🔊 Escuchar</button></div>`;
                
                chatBox.innerHTML += respuestaHTML;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                alert("Error al conectar con Oralis.");
            }
        }

        async function finalizarYEvaluar() {
            const payload = {
                historial: historialConversacion,
                idioma: document.getElementById('selIdioma').value,
                nivel: document.getElementById('selNivel').value
            };

            const res = await fetch('/evaluar_practica', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            const informeDiv = document.getElementById('informeContenido');
            informeDiv.innerHTML = `
                <h4>Puntuación: <span class="badge bg-success">${data.puntuacion}</span> (Nivel Demostrado: ${data.nivel_demostrado})</h4>
                <p><strong>Puntos Fuertes:</strong> ${data.puntos_fuertes ? data.puntos_fuertes.join(', ') : 'Ninguno registrado'}</p>
                <p><strong>Errores Principales:</strong> ${data.errores_principales ? data.errores_principales.join(' | ') : 'Sin errores graves'}</p>
                <p><strong>Consejo Pedagógico:</strong> ${data.consejos_mejora}</p>
            `;
            document.getElementById('informeBox').classList.remove('d-none');
        }

        async function procesarWriting() {
            const formData = new FormData();
            formData.append('texto', document.getElementById('writingTexto').value);
            formData.append('idioma', document.getElementById('selIdioma').value);
            formData.append('tipo_correccion', document.getElementById('writingModo').value);

            const fileInput = document.getElementById('writingFile');
            if (fileInput.files[0]) {
                formData.append('archivo', fileInput.files[0]);
            }

            const res = await fetch('/corregir_writing', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();

            const resDiv = document.getElementById('writingResultado');
            resDiv.classList.remove('d-none');

            let html = `<h5>Nota de Redacción: <span class="badge bg-info">${data.puntuacion_writing || 'N/A'}</span></h5>`;
            if (data.texto_corregido_sugerido) {
                html += `<p><strong>Sugerencia de corrección:</strong> ${data.texto_corregido_sugerido}</p>`;
            }
            if (data.desglose_errores && data.desglose_errores.length > 0) {
                html += "<h6>Desglose de Errores / Pistas:</h6><ul>";
                data.desglose_errores.forEach(e => {
                    html += `<li><strong>${e.error}:</strong> ${e.explicacion} ${e.pista ? `<br><small class="text-warning">💡 Pista: ${e.pista}</small>` : ''}</li>`;
                });
                html += "</ul>";
            }
            resDiv.innerHTML = html;
        }

        async function reproducirAudio(texto) {
            const res = await fetch('/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ texto: texto, idioma: document.getElementById('selIdioma').value })
            });
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            audio.play();
        }
    </script>
</body>
</html>
