<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oralis - Tutor & Profesor de Idiomas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .chat-box { height: 420px; overflow-y: auto; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 15px; }
        .msg-user { text-align: right; color: #0284c7; margin-bottom: 12px; font-weight: 500; }
        .msg-oralis { text-align: left; color: #0f172a; margin-bottom: 15px; background-color: #e2e8f0; padding: 12px; border-radius: 10px; }
        .nav-pills .nav-link { color: #475569; font-weight: 600; margin-right: 5px; }
        .nav-pills .nav-link.active { background-color: #0284c7; color: white; }
        .historial-box { height: 420px; overflow-y: auto; font-size: 0.88rem; background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; }
    </style>
</head>
<body class="container-fluid py-4 px-md-5">

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
            <h2 class="fw-bold text-primary mb-0">Oralis</h2>
            <small class="text-muted">Tutor, Profesor y Asistente Interactivo de Idiomas — Universidad de Sevilla</small>
        </div>
        <a href="/animind" class="btn btn-outline-secondary btn-sm">🎬 Ir a AniMind Anime</a>
    </div>

    <!-- Navegación por Pestañas -->
    <ul class="nav nav-pills mb-4" id="oralisTabs">
        <li class="nav-item">
            <button class="nav-link active" onclick="cambiarModo('conversacion')">💬 Conversación Libre</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" onclick="cambiarModo('profesor')">🎓 Modo Profesor (Clases)</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" onclick="cambiarModo('tutor')">💼 Simulación de Profesiones</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" onclick="cambiarModo('writing')">📝 Corrección de Writing</button>
        </li>
    </ul>

    <!-- Panel de Configuración Global -->
    <div class="card card-custom p-3 mb-4">
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label fw-bold">Idioma de Práctica:</label>
                <select id="selIdioma" class="form-select">
                    <option value="en">Inglés</option>
                    <option value="fr">Francés</option>
                    <option value="de">Alemán</option>
                    <option value="it">Italiano</option>
                    <option value="pt">Portugués</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold">Nivel MCERL:</label>
                <select id="selNivel" class="form-select">
                    <option value="A1">A1 - Principiante</option>
                    <option value="A2">A2 - Elemental</option>
                    <option value="B1" selected>B1 - Intermedio</option>
                    <option value="B2">B2 - Intermedio Alto</option>
                    <option value="C1">C1 - Avanzado</option>
                </select>
            </div>

            <!-- Banco de Profesiones -->
            <div class="col-md-3 d-none" id="divProfesion">
                <label class="form-label fw-bold">Banco de Profesiones / Rol:</label>
                <select id="selProfesion" class="form-select" onchange="actualizarProfesionPersonalizada(this.value)">
                    <option value="Camarero / Barista">Camarero / Barista</option>
                    <option value="Médico / Doctor">Médico / Doctor</option>
                    <option value="Entrevistador de Trabajo">Entrevistador de Trabajo</option>
                    <option value="Recepcionista de Hotel">Recepcionista de Hotel</option>
                    <option value="Guía Turístico">Guía Turístico</option>
                    <option value="OTRO">Personalizado...</option>
                </select>
                <input type="text" id="inputProfesionCustom" class="form-control mt-2 d-none" placeholder="Escribe la profesión deseada">
            </div>

            <!-- Tema o Situación -->
            <div class="col-md-3" id="divTema">
                <label class="form-label fw-bold">Tema / Situación:</label>
                <input type="text" id="inputTema" class="form-control" value="Conversación cotidiana y presentaciones">
            </div>
        </div>
    </div>

    <!-- SECCIÓN INTERACTIVA PRINCIPAL (CHAT + HISTORIAL) -->
    <div id="seccionChat" class="row g-3">
        <div class="col-md-8">
            <div class="card card-custom p-3">
                <div id="chatBox" class="chat-box mb-3"></div>
                <div class="input-group">
                    <input type="text" id="userMsg" class="form-control" placeholder="Escribe tu mensaje en el idioma objetivo..." onkeypress="if(event.key==='Enter') enviarMensaje()">
                    <button class="btn btn-primary px-4" onclick="enviarMensaje()">Enviar</button>
                </div>
            </div>
        </div>

        <!-- Panel Lateral: Historial y Feedback -->
        <div class="col-md-4">
            <div class="card card-custom p-3">
                <h6 class="fw-bold text-secondary mb-2">📋 Historial & Evaluación de la Sesión</h6>
                <div id="historialBox" class="historial-box mb-3">
                    <em class="text-muted">Aquí se irá guardando el registro completo de tu conversación...</em>
                </div>
                <button class="btn btn-warning w-100 fw-bold" onclick="evaluarPractica()">📊 Finalizar y Evaluar Sesión</button>
            </div>
        </div>
    </div>

    <!-- SECCIÓN CORRECCIÓN DE WRITING -->
    <div id="seccionWriting" class="card card-custom p-4 d-none">
        <h4 class="text-primary fw-bold mb-3">Corrector y Analizador de Redacción (Writing)</h4>
        <div class="mb-3">
            <label class="form-label fw-bold">Pega tu redacción aquí:</label>
            <textarea id="writingTexto" class="form-control" rows="6" placeholder="Escribe o pega aquí tu texto largo..."></textarea>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-bold">O adjunta un archivo (PDF, DOCX, TXT):</label>
                <input type="file" id="writingFile" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Modo de Corrección:</label>
                <select id="writingModo" class="form-select">
                    <option value="explicativa">Explicativa (Palabra por palabra y estructuras)</option>
                    <option value="senalar">Señalar tipo de error</option>
                    <option value="descubrimiento">Modo Autodescubrimiento (con pistas)</option>
                </select>
            </div>
        </div>
        <button class="btn btn-success px-4" onclick="procesarWriting()">Corregir Redacción</button>

        <div id="writingResultado" class="mt-4 p-3 bg-light border rounded d-none"></div>
    </div>

    <!-- INFORME DE EVALUACIÓN FINAL -->
    <div id="informeBox" class="card card-custom p-4 mt-4 d-none">
        <h4 class="text-success fw-bold">Informe de Evaluación Final</h4>
        <hr>
        <div id="informeContenido"></div>
    </div>

    <script>
        let modoActual = 'conversacion';
        let historialConversacion = [];

        function cambiarModo(modo) {
            modoActual = modo;
            document.querySelectorAll('#oralisTabs .nav-link').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('divProfesion').classList.toggle('d-none', modo !== 'tutor');
            document.getElementById('seccionChat').classList.toggle('d-none', modo === 'writing');
            document.getElementById('seccionWriting').classList.toggle('d-none', modo !== 'writing');
        }

        function actualizarProfesionPersonalizada(val) {
            const customInput = document.getElementById('inputProfesionCustom');
            customInput.classList.toggle('d-none', val !== 'OTRO');
        }

        async function enviarMensaje() {
            const input = document.getElementById('userMsg');
            const mensaje = input.value.trim();
            if (!mensaje) return;

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="msg-user"><strong>Tú:</strong> ${mensaje}</div>`;
            input.value = "";

            let profesionSel = document.getElementById('selProfesion').value;
            if (profesionSel === 'OTRO') {
                profesionSel = document.getElementById('inputProfesionCustom').value || "Profesional";
            }

            const payload = {
                mensaje: mensaje,
                idioma: document.getElementById('selIdioma').value,
                nivel: document.getElementById('selNivel').value,
                modo: modoActual,
                profesion: profesionSel,
                tema: document.getElementById('inputTema').value
            };

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                let htmlRespuesta = `<div class="msg-oralis"><strong>Oralis:</strong> ${data.respuesta || ''}<br>`;
                if (data.correccion && data.correccion !== "Todo correcto") {
                    htmlRespuesta += `<small class="text-danger">✏️ <strong>Corrección:</strong> ${data.correccion}</small><br>`;
                }
                if (data.explicacion) {
                    htmlRespuesta += `<small class="text-secondary">💡 <strong>Explicación:</strong> ${data.explicacion}</small><br>`;
                }
                if (data.vocabulario) {
                    htmlRespuesta += `<small class="text-primary">📖 <strong>Vocabulario:</strong> ${data.vocabulario}</small><br>`;
                }
                htmlRespuesta += `<button class="btn btn-sm btn-outline-primary mt-2" onclick="reproducirAudio('${data.respuesta}')">🔊 Escuchar</button></div>`;

                chatBox.innerHTML += htmlRespuesta;
                chatBox.scrollTop = chatBox.scrollHeight;

                // Guardar en el Historial Lateral
                historialConversacion.push({ usuario: mensaje, oralis: data.respuesta });
                actualizarHistorialVisual();

            } catch (err) {
                alert("Error de conexión con el servidor.");
            }
        }

        function actualizarHistorialVisual() {
            const box = document.getElementById('historialBox');
            box.innerHTML = historialConversacion.map((item, idx) => `
                <div class="mb-2 pb-1 border-bottom">
                    <strong>#${idx+1} Tú:</strong> ${item.usuario}<br>
                    <span class="text-muted">Oralis:</span> ${item.oralis}
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        async function evaluarPractica() {
            if (historialConversacion.length === 0) {
                alert("Primero debes mantener una conversación con Oralis para poder evaluar la sesión.");
                return;
            }

            const res = await fetch('/evaluar_practica', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    historial: historialConversacion,
                    idioma: document.getElementById('selIdioma').value,
                    nivel: document.getElementById('selNivel').value
                })
            });
            const data = await res.json();

            const informeDiv = document.getElementById('informeContenido');
            informeDiv.innerHTML = `
                <h5>Nota Final: <span class="badge bg-primary fs-6">${data.puntuacion} / 10</span> (Nivel Demostrado: <strong>${data.nivel_demostrado}</strong>)</h5>
                <p><strong>Puntos Fuertes:</strong> ${data.puntos_fuertes}</p>
                <p><strong>Errores Principales:</strong> ${data.errores_principales}</p>
                <p><strong>Recomendación Pedagógica:</strong> ${data.consejos_mejora}</p>
            `;
            document.getElementById('informeBox').classList.remove('d-none');
        }

        async function procesarWriting() {
            const formData = new FormData();
            formData.append('texto', document.getElementById('writingTexto').value);
            formData.append('idioma', document.getElementById('selIdioma').value);
            formData.append('tipo_correccion', document.getElementById('writingModo').value);

            const fileInput = document.getElementById('writingFile');
            if (fileInput.files[0]) {
                formData.append('archivo', fileInput.files[0]);
            }

            const res = await fetch('/corregir_writing', { method: 'POST', body: formData });
            const data = await res.json();

            const resDiv = document.getElementById('writingResultado');
            resDiv.classList.remove('d-none');

            let html = `<h5>Puntuación de Redacción: <span class="badge bg-success">${data.puntuacion_writing || 'N/A'}</span></h5>`;
            if (data.texto_corregido_sugerido) {
                html += `<p class="mt-2"><strong>Versión Sugerida:</strong> ${data.texto_corregido_sugerido}</p>`;
            }
            if (data.desglose_errores && data.desglose_errores.length > 0) {
                html += "<h6>Análisis de Errores:</h6><ul>";
                data.desglose_errores.forEach(e => {
                    html += `<li><strong>${e.error}:</strong> ${e.explicacion} ${e.pista ? `<br><small class="text-warning">💡 Pista: ${e.pista}</small>` : ''}</li>`;
                });
                html += "</ul>";
            }
            resDiv.innerHTML = html;
        }

        async function reproducirAudio(texto) {
            const res = await fetch('/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ texto: texto, idioma: document.getElementById('selIdioma').value })
            });
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            audio.play();
        }
    </script>
</body>
</html>
