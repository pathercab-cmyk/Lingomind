<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oralis AI - Tu Tutor Inteligente de Idiomas</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Panel Lateral (Configuración) --- */
        .sidebar {
            width: 320px;
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        select, input[type="text"], textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        select:focus, input[type="text"]:focus, textarea:focus {
            border-color: var(--primary);
        }

        .user-info {
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-logout {
            color: #ef4444;
            text-decoration: none;
            font-weight: 600;
        }

        /* --- Contenedor Principal (Chat) --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            padding: 15px 25px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
        }

        .chat-box {
            flex: 1;
            padding: 20px 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mensaje {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .mensaje.usuario {
            align-self: flex-end;
            background-color: var(--primary);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .mensaje.ia {
            align-self: flex-start;
            background-color: #f1f5f9;
            color: var(--text-main);
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border-color);
        }

        .mensaje.cargando {
            font-style: italic;
            color: var(--text-muted);
        }

        /* --- Área de Entrada --- */
        .chat-input-area {
            padding: 15px 25px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
        }

        .chat-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .file-upload-label {
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .file-upload-label:hover {
            background: #e2e8f0;
        }

        input[type="file"] {
            display: none;
        }

        .chat-form input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
        }

        .btn-send {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-send:hover {
            background: var(--primary-hover);
        }

        .file-indicator {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* --- Modal / Sección Feedback --- */
        .feedback-section {
            padding: 15px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-top: 10px;
        }

        .feedback-section h3 {
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .feedback-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .feedback-form button {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR: OPCIONES DE APRENDIZAJE -->
    <div class="sidebar">
        <h2>Oralis AI</h2>

        <div class="form-group">
            <label for="idioma">Idioma Objetivo:</label>
            <select id="idioma" name="idioma" onchange="actualizarExamenes()">
                <option value="en" selected>Inglés</option>
                <option value="fr">Francés</option>
                <option value="de">Alemán</option>
                <option value="it">Italiano</option>
                <option value="pt">Portugués</option>
                <option value="es">Español</option>
                <option value="zh">Chino Mandarín</option>
                <option value="ja">Japonés</option>
                <option value="ru">Ruso</option>
                <option value="ro">Rumano</option>
                <option value="nl">Holandés</option>
                <option value="ar">Árabe</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nivel">Nivel Marco Europeo (CEFR):</label>
            <select id="nivel" name="nivel">
                <option value="A1">A1 (Principiante)</option>
                <option value="A2">A2 (Básico)</option>
                <option value="B1" selected>B1 (Intermedio)</option>
                <option value="B2">B2 (Intermedio Alto)</option>
                <option value="C1">C1 (Avanzado)</option>
                <option value="C2">C2 (Maestría)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="modo">Modo de Aprendizaje:</label>
            <select id="modo" name="modo" onchange="toggleModos()">
                <option value="tutor_original">Tutor General</option>
                <option value="practicas_orales">Simulación de Rol / Práctica Oral</option>
                <option value="examen">Preparación Examen Oficial</option>
                <option value="writing">Evaluador de Textos / Writing</option>
            </select>
        </div>

        <div class="form-group" id="group-writing" style="display: none;">
            <label for="metodo_writing">Método de Corrección:</label>
            <select id="metodo_writing" name="metodo_writing">
                <option value="gramatica" selected>1. Corrección Gramatical y Estilística Directa</option>
                <option value="socratico">2. Método Guiado / Socrático (Pistas y Auto-corrección)</option>
            </select>
        </div>

        <!-- Opción Dinámica: Rol / Profesión -->
        <div class="form-group" id="group-profesion" style="display: none;">
            <label for="profesion">Perfil de Simulación:</label>
            <select id="profesion" name="profesion" onchange="toggleCustomProfesion()">
                <option value="Entrevista de Trabajo">Entrevista de Trabajo</option>
                <option value="Atención al Cliente">Atención al Cliente / Turista</option>
                <option value="Médico / Salud">Consulta Médica</option>
                <option value="Negocios / Reunión">Reunión de Negocios</option>
                <option value="Otro">Otro (Personalizado)</option>
            </select>
            <input type="text" id="profesion_custom" name="profesion_custom" placeholder="Especifica el rol..." style="display: none; margin-top: 5px;">
        </div>

        <!-- Opción Dinámica: Exámenes -->
        <div class="form-group" id="group-examen" style="display: none;">
            <label for="tipo_examen">Examen Oficial:</label>
            <select id="tipo_examen" name="tipo_examen">
                <!-- Se llena dinámicamente con JS -->
            </select>
        </div>

        <!-- Opción Dinámica: Tema -->
        <div class="form-group">
            <label for="tema">Tema o Contexto Libre:</label>
            <input type="text" id="tema" name="tema" placeholder="E.g., Vocabulario de viajes...">
        </div>

        <!-- FEEDBACK EN LA BARRA LATERAL -->
        <div class="feedback-section">
            <h3>¿Qué te parece Oralis?</h3>
            <form id="form-feedback" class="feedback-form" onsubmit="enviarFeedback(event)">
                <select name="puntuacion" required>
                    <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                    <option value="4">⭐⭐⭐⭐ (4/5)</option>
                    <option value="3">⭐⭐⭐ (3/5)</option>
                    <option value="2">⭐⭐ (2/5)</option>
                    <option value="1">⭐ (1/5)</option>
                </select>
                <input type="text" name="comentario" placeholder="Escribe tu opinión..." required>
                <button type="submit">Enviar Opinión</button>
            </form>
            <p id="msg-feedback" style="font-size: 0.75rem; color: #10b981; margin-top: 5px;"></p>
        </div>

        <!-- DATOS DEL USUARIO -->
        <div class="user-info">
            <span>👤 {{ usuario.email }}</span>
            <a href="/logout" class="btn-logout">Salir</a>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL: CHAT -->
    <div class="main-content">
        <div class="chat-header">
            Oralis AI - Tutor en Tiempo Real
        </div>

        <div id="chat-box" class="chat-box">
            <div class="mensaje ia">
                ¡Hola! Soy Oralis. Selecciona tu idioma y nivel en el menú de la izquierda y escríbeme para comenzar a practicar.
            </div>
        </div>

        <div class="chat-input-area">
            <form id="form-chat" class="chat-form" onsubmit="enviarMensaje(event)">
                <!-- Selector de archivo -->
                <label for="archivo" class="file-upload-label" title="Adjuntar PDF, DOCX o TXT">
                    📎
                </label>
                <input type="file" id="archivo" name="archivo" accept=".pdf,.docx,.txt" onchange="mostrarNombreArchivo()">

                <!-- Campo de mensaje -->
                <input type="text" id="input-mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." autocomplete="off" required>

                <!-- Botón de Envío -->
                <button type="submit" class="btn-send">Enviar</button>
            </form>
            <div id="file-indicator" class="file-indicator"></div>
        </div>
    </div>

    <!-- JAVASCRIPT DE LA APLICACIÓN -->
    <script>
        // Cargar exámenes al iniciar
        document.addEventListener("DOMContentLoaded", () => {
            actualizarExamenes();
        });

        // Alternar visibilidad de configuraciones según el modo
       function toggleModos() {
    const modo = document.getElementById('modo').value;
    
    // Muestra u oculta según el modo seleccionado
    if (document.getElementById('group-profesion')) {
        document.getElementById('group-profesion').style.display = (modo === 'practicas_orales') ? 'flex' : 'none';
    }
    if (document.getElementById('group-examen')) {
        document.getElementById('group-examen').style.display = (modo === 'examen') ? 'flex' : 'none';
    }
    if (document.getElementById('group-writing')) {
        document.getElementById('group-writing').style.display = (modo === 'writing') ? 'flex' : 'none';
    }
}

// Asegúrate de llamar a toggleModos al cambiar el select de modo
document.getElementById('modo').addEventListener('change', toggleModos);

        function toggleCustomProfesion() {
            const profesion = document.getElementById('profesion').value;
            document.getElementById('profesion_custom').style.display = (profesion === 'Otro') ? 'block' : 'none';
        }

        // Obtener la lista de exámenes desde la API de Flask
        async function actualizarExamenes() {
            const idioma = document.getElementById('idioma').value;
            const selectExamen = document.getElementById('tipo_examen');
            selectExamen.innerHTML = '';

            try {
                const res = await fetch(`/api/examenes/${idioma}`);
                const data = await res.json();

                data.examenes.forEach(ex => {
                    const opt = document.createElement('option');
                    opt.value = ex;
                    opt.innerText = ex;
                    selectExamen.appendChild(opt);
                });
            } catch (e) {
                console.error("Error al cargar exámenes:", e);
            }
        }

        // Mostrar nombre del archivo seleccionado
        function mostrarNombreArchivo() {
            const input = document.getElementById('archivo');
            const indicator = document.getElementById('file-indicator');
            if (input.files.length > 0) {
                indicator.innerText = `📄 Archivo listo: ${input.files[0].name}`;
            } else {
                indicator.innerText = '';
            }
        }

        // LÓGICA DE ENVÍO DE MENSAJES Y STREAMING
        async function enviarMensaje(event) {
            event.preventDefault();

            const inputMensaje = document.getElementById('input-mensaje');
            const chatBox = document.getElementById('chat-box');
            const mensajeTexto = inputMensaje.value.trim();

            if (!mensajeTexto) return;

            // 1. Mostrar de inmediato el mensaje del usuario en pantalla
            const divUsuario = document.createElement('div');
            divUsuario.className = 'mensaje usuario';
            divUsuario.innerText = mensajeTexto;
            chatBox.appendChild(divUsuario);

            // Limpiar inputs
            inputMensaje.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Crear indicador de carga para la respuesta de la IA
            const divIA = document.createElement('div');
            divIA.className = 'mensaje ia cargando';
            divIA.innerText = 'Oralis está escribiendo...';
            chatBox.appendChild(divIA);
            chatBox.scrollTop = chatBox.scrollHeight;

            // 3. Empaquetar todo el formulario (Mensaje + Archivo + Ajustes del Sidebar)
            const formData = new FormData();
            formData.append('mensaje', mensajeTexto);
            formData.append('idioma', document.getElementById('idioma').value);
            formData.append('nivel', document.getElementById('nivel').value);
            formData.append('modo', document.getElementById('modo').value);
            formData.append('profesion', document.getElementById('profesion').value);
            formData.append('profesion_custom', document.getElementById('profesion_custom').value);
            formData.append('tipo_examen', document.getElementById('tipo_examen').value);
            formData.append('tema', document.getElementById('tema').value);

            // Añade este valor a las variables que envías en FormData:
            formData.append('metodo_writing', document.getElementById('metodo_writing').value);

            const archivoInput = document.getElementById('archivo');
            if (archivoInput.files.length > 0) {
                formData.append('archivo', archivoInput.files[0]);
            }

            // Resetear indicador de archivo
            archivoInput.value = '';
            document.getElementById('file-indicator').innerText = '';

            // 4. Enviar Petición Stream al Backend
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error("Error en la conexión con el servidor.");
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let esPrimerChunk = true;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lineas = chunk.split('\n');

                    for (const linea of lineas) {
                        if (linea.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(linea.replace('data: ', ''));

                                if (data.error) {
                                    divIA.innerText = 'Error: ' + data.error;
                                    break;
                                }

                                if (data.content) {
                                    if (esPrimerChunk) {
                                        divIA.innerText = '';
                                        divIA.classList.remove('cargando');
                                        esPrimerChunk = false;
                                    }
                                    divIA.innerText += data.content;
                                    chatBox.scrollTop = chatBox.scrollHeight;
                                }
                            } catch (e) {
                                // Ignorar errores de parseo en JSONs fragmentados
                            }
                        }
                    }
                }
            } catch (error) {
                console.error(error);
                divIA.innerText = 'Error al recibir respuesta del servidor.';
                divIA.classList.remove('cargando');
            }
        }

        // LÓGICA DE FEEDBACK
        async function enviarFeedback(event) {
            event.preventDefault();
            const formData = new FormData(document.getElementById('form-feedback'));
            const msgEl = document.getElementById('msg-feedback');

            try {
                const response = await fetch('/api/feedback', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                msgEl.innerText = data.mensaje;
                if (response.ok) {
                    document.getElementById('form-feedback').reset();
                }
            } catch (e) {
                msgEl.innerText = "Error al enviar comentario.";
            }
        }
    </script>
</body>
</html>
